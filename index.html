<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b2027;
    --bg-soft: #232a34;
    --card: #242c37;
    --border: rgba(237,234,227,0.08);
    --text: #edeae3;
    --muted: #8b93a0;
    --amber: #e8a94c;
    --amber-dim: rgba(232,169,76,0.35);
    --me: #b1592f;
    --them: #333d4c;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #232b36 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- Login screen ---- */
  #login{
    width: min(90vw, 380px);
    text-align:center;
  }
  #login .porch{
    width:14px; height:14px; border-radius:50%;
    background: var(--amber);
    margin: 0 auto 22px;
    box-shadow: 0 0 0 6px var(--amber-dim);
    animation: glow 2.4s ease-in-out infinite;
  }
  #login h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 2rem;
    margin: 0 0 6px;
  }
  #login p{
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 26px;
  }
  #login input{
    width:100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    margin-bottom: 12px;
  }
  #login input:focus{ border-color: var(--amber-dim); }
  #login button{
    width:100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #201404;
    font-weight: 600;
    font-size: 1rem;
    cursor:pointer;
  }
  #login button:disabled{ opacity:0.5; cursor:default; }

  /* ---- Chat screen ---- */
  #app{
    width: min(94vw, 460px);
    height: min(92vh, 720px);
    background: var(--bg-soft);
    border-radius: 18px;
    border: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  header{
    padding: 18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid var(--border);
  }
  header .title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.25rem;
  }
  header .presence{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px var(--amber-dim);
    animation: glow 2.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes glow{
    0%,100%{ box-shadow: 0 0 0 4px var(--amber-dim); }
    50%{ box-shadow: 0 0 0 8px transparent; }
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .msg{
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 0.94rem;
    line-height:1.4;
    word-wrap: break-word;
  }
  .msg .who{
    display:block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 3px;
    font-weight:600;
    letter-spacing: 0.02em;
  }
  .msg .time{
    display:block;
    font-size: 0.65rem;
    color: rgba(237,234,227,0.45);
    margin-top: 4px;
    text-align:right;
  }
  .msg.them{
    background: var(--them);
    align-self:flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.me{
    background: var(--me);
    align-self:flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.me .time{ color: rgba(255,255,255,0.55); }

  #empty{
    margin:auto;
    text-align:center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0 30px;
  }

  form#composer{
    display:flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  form#composer input{
    flex:1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline:none;
  }
  form#composer input:focus{ border-color: var(--amber-dim); }
  form#composer button{
    padding: 0 18px;
    border-radius: 10px;
    border:none;
    background: var(--amber);
    color:#201404;
    font-weight:600;
    cursor:pointer;
  }

  #status{
    font-size: 0.72rem;
    color: var(--muted);
    text-align:center;
    padding: 6px 0 0;
  }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(237,234,227,0.12); border-radius: 8px; }

  @media (prefers-reduced-motion: reduce){
    .dot, #login .porch{ animation: none; }
  }
</style>
</head>
<body>

  <div id="login">
    <div class="porch"></div>
    <h1>Homeline</h1>
    <p>Leave your name to come in from the porch.</p>
    <input id="nameInput" type="text" placeholder="Your name" maxlength="24" autocomplete="off">
    <button id="enterBtn">Come in</button>
    <div id="status"></div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <div class="title">Homeline</div>
      <div class="presence"><span class="dot"></span><span id="presenceCount">— home</span></div>
    </header>
    <div id="messages">
      <div id="empty">No messages yet. Say something.</div>
    </div>
    <form id="composer">
      <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" maxlength="500">
      <button type="submit">Send</button>
    </form>
  </div>

<!-- Firebase (compat SDK — simplest for a single static file) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
/*
  ====== SETUP: fill this in with YOUR Firebase project's config ======
  1. Go to https://console.firebase.google.com -> Create project
  2. Add a Web App to the project, copy the config object it gives you
  3. Enable "Anonymous" sign-in: Build > Authentication > Sign-in method
  4. Enable Realtime Database: Build > Realtime Database > Create Database
  5. Paste your config below, replacing the placeholder values.
  Full walkthrough in the README that comes with this app.
*/
const firebaseConfig = {
  apiKey: "AIzaSyBEqX4AvMf3WeCWyxzwQFvFVQMwvkSErZw",
  authDomain: "local-chat-286e0.firebaseapp.com",
  projectId: "local-chat-286e0",
  storageBucket: "local-chat-286e0.firebasestorage.app",
  messagingSenderId: "766633630215",
  appId: "1:766633630215:web:5cb691bfb772c161dce8a2",
databaseURL: "https://local-chat-286e0-default-rtdb.firebaseio.com"
};

// ======================================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('nameInput');
const enterBtn = document.getElementById('enterBtn');
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const composer = document.getElementById('composer');
const textInput = document.getElementById('textInput');
const presenceCountEl = document.getElementById('presenceCount');

let myName = localStorage.getItem('homeline_name') || '';
let myUid = null;

nameInput.value = myName;

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function isNearBottom(){
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
}

function renderMessage(msg){
  emptyEl.style.display = 'none';
  const mine = msg.uid === myUid;
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (mine ? 'me' : 'them');
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = mine ? 'You' : msg.name;
  const body = document.createElement('div');
  body.textContent = msg.text;
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = formatTime(msg.ts);
  wrap.appendChild(who);
  wrap.appendChild(body);
  wrap.appendChild(time);
  const wasNearBottom = isNearBottom();
  messagesEl.appendChild(wrap);
  if(wasNearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function startChat(){
  loginEl.style.display = 'none';
  appEl.style.display = 'flex';

  // Listen for new messages (last 100)
  db.ref('messages').limitToLast(100).on('child_added', snap => {
    renderMessage(snap.val());
  });

  // Presence: mark myself home, remove on disconnect
  const presenceRef = db.ref('presence/' + myUid);
  db.ref('.info/connected').on('value', snap => {
    if(snap.val() === true){
      presenceRef.onDisconnect().remove();
      presenceRef.set({ name: myName, since: firebase.database.ServerValue.TIMESTAMP });
    }
  });
  db.ref('presence').on('value', snap => {
    const count = snap.numChildren();
    presenceCountEl.textContent = count === 1 ? '1 home' : count + ' home';
  });

  composer.addEventListener('submit', e => {
    e.preventDefault();
    const text = textInput.value.trim();
    if(!text) return;
    db.ref('messages').push({
      name: myName,
      uid: myUid,
      text: text,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    textInput.value = '';
  });

  textInput.focus();
}

function enter(){
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  myName = name;
  localStorage.setItem('homeline_name', myName);
  enterBtn.disabled = true;
  statusEl.textContent = 'Opening the door…';

  auth.signInAnonymously().then(cred => {
    myUid = cred.user.uid;
    startChat();
  }).catch(err => {
    console.error(err);
    statusEl.textContent = 'Could not connect. Check the Firebase setup in index.html (see README).';
    enterBtn.disabled = false;
  });
}

enterBtn.addEventListener('click', enter);
nameInput.addEventListener('keydown', e => { if(e.key === 'Enter') enter(); });
</script>
</body>
</html>
