<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1b2027;
    --bg-soft: #232a34;
    --card: #242c37;
    --border: rgba(237,234,227,0.08);
    --text: #edeae3;
    --muted: #8b93a0;
    --amber: #e8a94c;
    --amber-dim: rgba(232,169,76,0.35);
    --me: #b1592f;
    --them: #333d4c;
    --danger: #c1663d;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(1200px 800px at 50% -10%, #232b36 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- Login screen ---- */
  #login{
    width: min(90vw, 380px);
    text-align:center;
  }
  #login .porch{
    width:14px; height:14px; border-radius:50%;
    background: var(--amber);
    margin: 0 auto 22px;
    box-shadow: 0 0 0 6px var(--amber-dim);
    animation: glow 2.4s ease-in-out infinite;
  }
  #login h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 2rem;
    margin: 0 0 6px;
  }
  #login p{
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 26px;
  }
  #login input{
    width:100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    margin-bottom: 12px;
  }
  #login input:focus{ border-color: var(--amber-dim); }
  #login button{
    width:100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: var(--amber);
    color: #201404;
    font-weight: 600;
    font-size: 1rem;
    cursor:pointer;
  }
  #login button:disabled{ opacity:0.5; cursor:default; }

  /* ---- Chat screen ---- */
  #app{
    width: min(94vw, 460px);
    height: min(92vh, 720px);
    background: var(--bg-soft);
    border-radius: 18px;
    border: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  header{
    padding: 16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom: 1px solid var(--border);
  }
  header .title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.2rem;
  }
  header .right{
    display:flex;
    align-items:center;
    gap:14px;
  }
  header .presence{
    display:flex;
    align-items:center;
    gap:7px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 0 4px var(--amber-dim);
    animation: glow 2.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes glow{
    0%,100%{ box-shadow: 0 0 0 4px var(--amber-dim); }
    50%{ box-shadow: 0 0 0 8px transparent; }
  }
  #logoutBtn{
    background:none; border:none; color: var(--muted);
    font-size: 0.78rem; cursor:pointer; padding:0;
  }
  #logoutBtn:hover{ color: var(--text); }

  /* Tabs */
  #tabs{
    display:flex;
    border-bottom: 1px solid var(--border);
  }
  #tabs button{
    flex:1;
    background:none;
    border:none;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight:600;
    padding: 11px 0;
    cursor:pointer;
    border-bottom: 2px solid transparent;
  }
  #tabs button.active{
    color: var(--amber);
    border-bottom-color: var(--amber);
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding: 18px 16px;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .msg{
    max-width: 82%;
    padding: 9px 13px 8px;
    border-radius: 14px;
    font-size: 0.94rem;
    line-height:1.4;
  }
  .msg .who{
    display:block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 3px;
    font-weight:600;
    letter-spacing: 0.02em;
  }
  .msg .body{ word-wrap: break-word; overflow-wrap: anywhere; }
  .msg .body a{ color: inherit; text-decoration: underline; }
  .msg .foot{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap: 6px;
    margin-top: 4px;
  }
  .msg .time{
    font-size: 0.65rem;
    color: rgba(237,234,227,0.45);
  }
  .bmark-btn{
    background:none; border:none; padding:2px; cursor:pointer;
    color: rgba(237,234,227,0.4);
    display:flex; align-items:center;
    transition: color 0.15s;
  }
  .bmark-btn:hover{ color: var(--amber); }
  .bmark-btn.active{ color: var(--amber); }
  .bmark-btn svg{ width:14px; height:14px; }

  .msg.them{
    background: var(--them);
    align-self:flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.me{
    background: var(--me);
    align-self:flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.me .time{ color: rgba(255,255,255,0.55); }
  .msg.me .bmark-btn{ color: rgba(255,255,255,0.55); }
  .msg.me .bmark-btn:hover, .msg.me .bmark-btn.active{ color: #ffe3b8; }

  #empty, #emptyBookmarks{
    margin:auto;
    text-align:center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 0 30px;
  }

  form#composer{
    display:flex;
    gap: 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }
  form#composer input{
    flex:1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    outline:none;
  }
  form#composer input:focus{ border-color: var(--amber-dim); }
  form#composer button{
    padding: 0 18px;
    border-radius: 10px;
    border:none;
    background: var(--amber);
    color:#201404;
    font-weight:600;
    cursor:pointer;
  }

  #status{
    font-size: 0.72rem;
    color: var(--muted);
    text-align:center;
    padding: 6px 0 0;
  }

  /* ---- Bookmarks view ---- */
  #bookmarksView{
    flex:1;
    overflow-y:auto;
    padding: 16px;
    display:none;
    flex-direction:column;
    gap: 10px;
  }
  .bcard{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .bcard .btitle{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    color: var(--amber);
    margin-bottom: 4px;
  }
  .bcard .btitle.untitled{ color: var(--muted); font-family:'Inter',sans-serif; font-weight:600; font-size:0.85rem; }
  .bcard .btext{
    font-size: 0.9rem;
    line-height: 1.4;
    margin-bottom: 8px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .bcard .btext a{ color: var(--amber); text-decoration: underline; }
  .bcard .bmeta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .bcard .bremove{
    background:none; border:none; color: var(--danger);
    font-size: 0.72rem; cursor:pointer; padding:0;
  }
  .bcard .bremove:hover{ text-decoration: underline; }

  /* ---- Modal ---- */
  #modalOverlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(10,12,16,0.6);
    align-items:center;
    justify-content:center;
    z-index: 20;
  }
  #modalOverlay.show{ display:flex; }
  #modalBox{
    width: min(88vw, 340px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  #modalBox h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.05rem;
    margin: 0 0 4px;
  }
  #modalBox .preview{
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 14px;
    max-height: 60px;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  #modalBox input{
    width:100%;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text);
    font-size: 0.92rem;
    outline:none;
    margin-bottom: 14px;
  }
  #modalBox input:focus{ border-color: var(--amber-dim); }
  #modalBox .modalRow{
    display:flex;
    gap: 10px;
  }
  #modalBox .modalRow button{
    flex:1;
    padding: 11px 0;
    border-radius: 9px;
    border: none;
    font-weight:600;
    font-size: 0.88rem;
    cursor:pointer;
  }
  #modalCancel{ background: var(--them); color: var(--text); }
  #modalSave{ background: var(--amber); color: #201404; }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: rgba(237,234,227,0.12); border-radius: 8px; }

  @media (prefers-reduced-motion: reduce){
    .dot, #login .porch{ animation: none; }
  }
</style>
</head>
<body>

  <div id="login">
    <div class="porch"></div>
    <h1>Homeline</h1>
    <p>Sign in with the account made for you.</p>
    <input id="emailInput" type="email" placeholder="Email" autocomplete="username">
    <input id="passInput" type="password" placeholder="Password" autocomplete="current-password">
    <button id="enterBtn">Come in</button>
    <div id="status"></div>
  </div>

  <div id="app" style="display:none;">
    <header>
      <div class="title">Homeline</div>
      <div class="right">
        <div class="presence"><span class="dot"></span><span id="presenceCount">— home</span></div>
        <button id="logoutBtn">Log out</button>
      </div>
    </header>
    <div id="tabs">
      <button id="tabChat" class="active">Chat</button>
      <button id="tabBookmarks">Bookmarks</button>
    </div>
    <div id="messages">
      <div id="empty">No messages yet. Say something.</div>
    </div>
    <div id="bookmarksView">
      <div id="emptyBookmarks">Nothing bookmarked yet. Tap the ribbon on a message to save it here.</div>
    </div>
    <form id="composer">
      <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" maxlength="500">
      <button type="submit">Send</button>
    </form>
  </div>

  <div id="modalOverlay">
    <div id="modalBox">
      <h3>Bookmark this</h3>
      <div class="preview" id="modalPreview"></div>
      <input id="modalNote" type="text" placeholder="Title or note (optional)" maxlength="120">
      <div class="modalRow">
        <button id="modalCancel">Cancel</button>
        <button id="modalSave">Save</button>
      </div>
    </div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script>
/*
  ====== SETUP: fill this in with YOUR Firebase project's config ======
  See README.md for the full walkthrough (Firebase project, Email/Password
  auth, Realtime Database rules).
*/
const firebaseConfig = {
  apiKey: "AIzaSyBEqX4Av...", // TODO: paste your FULL apiKey here (not truncated)
  authDomain: "local-chat-286e0.firebaseapp.com",
  projectId: "local-chat-286e0",
  storageBucket: "local-chat-286e0.firebasestorage.app",
  messagingSenderId: "766633630215",
  appId: "1:766633630215:web:5cb691bfb772c161dce8a2",
  databaseURL: "https://local-chat-286e0-default-rtdb.firebaseio.com"
};
// ======================================================================

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const statusEl = document.getElementById('status');
const emailInput = document.getElementById('emailInput');
const passInput = document.getElementById('passInput');
const enterBtn = document.getElementById('enterBtn');
const logoutBtn = document.getElementById('logoutBtn');

const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const bookmarksViewEl = document.getElementById('bookmarksView');
const emptyBookmarksEl = document.getElementById('emptyBookmarks');
const tabChat = document.getElementById('tabChat');
const tabBookmarks = document.getElementById('tabBookmarks');

const composer = document.getElementById('composer');
const textInput = document.getElementById('textInput');
const presenceCountEl = document.getElementById('presenceCount');

const modalOverlay = document.getElementById('modalOverlay');
const modalPreview = document.getElementById('modalPreview');
const modalNote = document.getElementById('modalNote');
const modalCancel = document.getElementById('modalCancel');
const modalSave = document.getElementById('modalSave');

let myUid = null;
let myName = '';

// messageId -> bookmark key (under bookmarks/{myUid}), so we know what's already saved
let bookmarksByMsgId = {};
// messageId -> { text, name, ts } for whatever is currently pending bookmarking
let pendingBookmark = null;

const BOOKMARK_OUTLINE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 1.5h8a.5.5 0 0 1 .5.5v12.2a.3.3 0 0 1-.46.25L8 12.1l-4.04 2.35a.3.3 0 0 1-.46-.25V2a.5.5 0 0 1 .5-.5Z"/></svg>';
const BOOKMARK_FILLED  = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1.5h8a.5.5 0 0 1 .5.5v12.2a.3.3 0 0 1-.46.25L8 12.1l-4.04 2.35a.3.3 0 0 1-.46-.25V2a.5.5 0 0 1 .5-.5Z"/></svg>';

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function isNearBottom(){
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
}

// Turns a text string into DOM nodes, auto-linkifying URLs
function linkify(text, container){
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  let lastIndex = 0, match;
  while((match = urlRegex.exec(text)) !== null){
    if(match.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
    const a = document.createElement('a');
    a.href = match[0];
    a.textContent = match[0];
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    container.appendChild(a);
    lastIndex = match.index + match[0].length;
  }
  if(lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
}

function updateBookmarkButton(btn, msgId){
  const active = !!bookmarksByMsgId[msgId];
  btn.classList.toggle('active', active);
  btn.innerHTML = active ? BOOKMARK_FILLED : BOOKMARK_OUTLINE;
  btn.title = active ? 'Remove bookmark' : 'Bookmark this';
}

function refreshAllBookmarkButtons(){
  document.querySelectorAll('.bmark-btn').forEach(btn => {
    updateBookmarkButton(btn, btn.dataset.msgId);
  });
}

function renderMessage(msgId, msg){
  emptyEl.style.display = 'none';
  const mine = msg.uid === myUid;
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (mine ? 'me' : 'them');

  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = mine ? 'You' : msg.name;

  const body = document.createElement('div');
  body.className = 'body';
  linkify(msg.text, body);

  const foot = document.createElement('div');
  foot.className = 'foot';

  const bBtn = document.createElement('button');
  bBtn.className = 'bmark-btn';
  bBtn.dataset.msgId = msgId;
  updateBookmarkButton(bBtn, msgId);
  bBtn.addEventListener('click', () => toggleBookmark(msgId, msg));

  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = formatTime(msg.ts);

  foot.appendChild(bBtn);
  foot.appendChild(time);

  wrap.appendChild(who);
  wrap.appendChild(body);
  wrap.appendChild(foot);

  const wasNearBottom = isNearBottom();
  messagesEl.appendChild(wrap);
  if(wasNearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
}

function toggleBookmark(msgId, msg){
  const existingKey = bookmarksByMsgId[msgId];
  if(existingKey){
    db.ref('bookmarks/' + myUid + '/' + existingKey).remove();
  } else {
    pendingBookmark = { messageId: msgId, text: msg.text, name: msg.uid === myUid ? 'You' : msg.name, ts: msg.ts };
    modalPreview.textContent = msg.text;
    modalNote.value = '';
    modalOverlay.classList.add('show');
    setTimeout(() => modalNote.focus(), 50);
  }
}

modalCancel.addEventListener('click', () => {
  modalOverlay.classList.remove('show');
  pendingBookmark = null;
});
modalSave.addEventListener('click', saveBookmark);
modalNote.addEventListener('keydown', e => { if(e.key === 'Enter') saveBookmark(); });

function saveBookmark(){
  if(!pendingBookmark) return;
  db.ref('bookmarks/' + myUid).push({
    messageId: pendingBookmark.messageId,
    text: pendingBookmark.text,
    name: pendingBookmark.name,
    ts: pendingBookmark.ts,
    note: modalNote.value.trim(),
    savedAt: firebase.database.ServerValue.TIMESTAMP
  });
  modalOverlay.classList.remove('show');
  pendingBookmark = null;
}

function renderBookmarksList(items){
  bookmarksViewEl.innerHTML = '';
  const keys = Object.keys(items || {});
  if(keys.length === 0){
    bookmarksViewEl.appendChild(emptyBookmarksEl);
    return;
  }
  keys.sort((a,b) => (items[a].savedAt||0) - (items[b].savedAt||0));
  keys.forEach(key => {
    const b = items[key];
    const card = document.createElement('div');
    card.className = 'bcard';

    const title = document.createElement('div');
    if(b.note){
      title.className = 'btitle';
      title.textContent = b.note;
    } else {
      title.className = 'btitle untitled';
      title.textContent = 'Untitled';
    }

    const text = document.createElement('div');
    text.className = 'btext';
    linkify(b.text, text);

    const meta = document.createElement('div');
    meta.className = 'bmeta';
    const who = document.createElement('span');
    who.textContent = b.name + ' · ' + formatTime(b.ts);
    const remove = document.createElement('button');
    remove.className = 'bremove';
    remove.textContent = 'Remove';
    remove.addEventListener('click', () => db.ref('bookmarks/' + myUid + '/' + key).remove());
    meta.appendChild(who);
    meta.appendChild(remove);

    card.appendChild(title);
    card.appendChild(text);
    card.appendChild(meta);
    bookmarksViewEl.appendChild(card);
  });
}

function showTab(tab){
  const chatActive = tab === 'chat';
  tabChat.classList.toggle('active', chatActive);
  tabBookmarks.classList.toggle('active', !chatActive);
  messagesEl.style.display = chatActive ? 'flex' : 'none';
  composer.style.display = chatActive ? 'flex' : 'none';
  bookmarksViewEl.style.display = chatActive ? 'none' : 'flex';
}
tabChat.addEventListener('click', () => showTab('chat'));
tabBookmarks.addEventListener('click', () => showTab('bookmarks'));

function startChat(){
  loginEl.style.display = 'none';
  appEl.style.display = 'flex';

  db.ref('messages').limitToLast(100).on('child_added', snap => {
    renderMessage(snap.key, snap.val());
  });

  const presenceRef = db.ref('presence/' + myUid);
  db.ref('.info/connected').on('value', snap => {
    if(snap.val() === true){
      presenceRef.onDisconnect().remove();
      presenceRef.set({ name: myName, since: firebase.database.ServerValue.TIMESTAMP });
    }
  });
  db.ref('presence').on('value', snap => {
    const count = snap.numChildren();
    presenceCountEl.textContent = count === 1 ? '1 home' : count + ' home';
  });

  db.ref('bookmarks/' + myUid).on('value', snap => {
    const items = snap.val() || {};
    bookmarksByMsgId = {};
    Object.keys(items).forEach(key => {
      bookmarksByMsgId[items[key].messageId] = key;
    });
    refreshAllBookmarkButtons();
    renderBookmarksList(items);
  });

  composer.addEventListener('submit', e => {
    e.preventDefault();
    const text = textInput.value.trim();
    if(!text) return;
    db.ref('messages').push({
      name: myName,
      uid: myUid,
      text: text,
      ts: firebase.database.ServerValue.TIMESTAMP
    });
    textInput.value = '';
  });

  textInput.focus();
}

function nameFromEmail(email){
  const prefix = email.split('@')[0];
  return prefix.charAt(0).toUpperCase() + prefix.slice(1);
}

function enter(){
  const email = emailInput.value.trim();
  const pass = passInput.value;
  if(!email || !pass){ statusEl.textContent = 'Enter your email and password.'; return; }
  enterBtn.disabled = true;
  statusEl.textContent = 'Opening the door…';

  auth.signInWithEmailAndPassword(email, pass).then(cred => {
    myUid = cred.user.uid;
    myName = nameFromEmail(email);
    startChat();
  }).catch(err => {
    console.error(err);
    statusEl.textContent = 'Wrong email or password.';
    enterBtn.disabled = false;
  });
}

logoutBtn.addEventListener('click', () => {
  auth.signOut().then(() => location.reload());
});

enterBtn.addEventListener('click', enter);
passInput.addEventListener('keydown', e => { if(e.key === 'Enter') enter(); });
</script>
</body>
</html>
